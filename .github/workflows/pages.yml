name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci is deliberately not used: this lockfile was written on Windows and
      # only records the win32 rolldown binary, so a clean Linux install cannot
      # find its native bundler binding (npm/cli#4828). npm install adds it.
      - run: npm install --no-audit --no-fund

      # Server-only secrets are deliberately absent: the Pages build has no
      # backend, so the app falls back to its bundled demo quotes and guest mode.
      - run: npm run build
        env:
          PAGES_BASE: /StockMark/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
